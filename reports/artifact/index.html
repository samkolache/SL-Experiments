<style>
:root{--ink:#05152a;--ink2:#304258;--mute:#687885;--line:#d8dfe6;--bg:#f5f8fc;--blue:#066dce;--blue-l:#eff7fe}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
.tabs{display:flex;gap:4px;background:#f0f2f5;padding:4px;border-radius:999px}
.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--ink2);padding:6px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.panel{flex:1;min-height:0;display:none}
.panel.on{display:flex}
#component{gap:0}
nav.files{width:280px;flex:none;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:10px 8px}
nav.files .dir{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:12px 10px 4px}
nav.files button{display:block;width:100%;text-align:left;border:0;background:none;font:13px ui-monospace,Menlo,monospace;color:var(--ink2);padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.files button:hover{background:var(--blue-l)}
nav.files button.on{background:var(--blue-l);color:var(--blue);font-weight:700}
.viewer{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:#fff}
.bar code{font:13px ui-monospace,Menlo,monospace;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;font-weight:600;color:var(--blue);padding:4px 12px;border-radius:6px;cursor:pointer}
.bar .meta{color:var(--mute);font-size:12px}
.code{flex:1;overflow:auto;background:#fff}
.code table{border-collapse:collapse;font:13px/1.55 ui-monospace,Menlo,monospace;min-width:100%}
.code td.n{user-select:none;text-align:right;color:#a0abb5;padding:0 12px 0 16px;vertical-align:top;border-right:1px solid var(--line);background:#fafbfc}
.code td.l{padding:0 16px;white-space:pre}
#report iframe{flex:1;border:0;width:100%;background:#fff}
@media (max-width:700px){#component{flex-direction:column}nav.files{width:auto;max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header>

    <button role="tab" id="t-report" aria-selected="false" aria-controls="report">Report</button>
  </div>
</header>
<section class="panel on" id="component" role="tabpanel" aria-labelledby="t-component">
  <nav class="files" id="files" aria-label="Files"></nav>
  <div class="viewer">
    <div class="bar"><code id="path"></code><span class="meta" id="meta"></span><button id="copy" type="button">Copy</button></div>
    <div class="code" id="code"></div>
  </div>
</section>
<section class="panel" id="report" role="tabpanel" aria-labelledby="t-report"></section>
<script id="data" type="application/json">[{"path": "fee-input.ts", "code": "// Input-display behaviour copied from VOB product-fees-utils.ts: trims the\n// visible value to 2 decimal places as the user types. No validation/saving.\n\nexport type FeeInputResult =\n  | { type: 'skip' }\n  | { type: 'empty' }\n  | { type: 'value'; fee: number };\n\nexport const MAX_FEE_AMOUNT = 5000;\n\nexport function parseFeeInput(input: HTMLInputElement): FeeInputResult {\n  const value = input.value;\n\n  if (value === '') {\n    return { type: 'empty' };\n  }\n\n  if (!/^\\d*\\.?\\d*$/.test(value)) {\n    return { type: 'skip' };\n  }\n\n  const [whole, dec = ''] = value.split('.');\n  const normalized = value.includes('.') ? `${whole}.${dec.slice(0, 2)}` : whole;\n\n  if (normalized !== value) {\n    input.value = normalized;\n  }\n\n  if (normalized.endsWith('.')) {\n    return { type: 'skip' };\n  }\n\n  const num = Number(normalized);\n  if (!Number.isFinite(num)) {\n    return { type: 'skip' };\n  }\n\n  return { type: 'value', fee: Math.round((num + Number.EPSILON) * 100) / 100 };\n}\n"}, {"path": "product-and-fees.component.html", "code": "<!-- UI-only replica of VendorOnBoardingSpa's /onboarding/product-and-fees screen\n     (OnboardingLayoutComponent shell + MilestoneHeader + MilestoneSidebar + ProductAndFees).\n     The route flags are fixed to the Products & Fees state. -->\n<main class=\"layout-shell vob-pf-root is-product-fees\">\n  <img src=\"assets/images/signup/sign-up-circle-bottom.svg\"\n       alt=\"\"\n       aria-hidden=\"true\"\n       class=\"signup-circle-bottom\" />\n\n  <img src=\"assets/images/signup/sign-up-circle.svg\"\n       alt=\"\"\n       aria-hidden=\"true\"\n       class=\"signup-circle\" />\n\n  <app-milestone-header class=\"layout-header\" [steps]=\"steps\" [activeIndex]=\"activeIndex\"><\/app-milestone-header>\n\n  <div class=\"layout-body\">\n    <div class=\"layout-container\">\n      <!-- Only visible at >=1370, where the mocks replace the horizontal\n           milestone header with this column (see .layout-sidenav). -->\n      <div class=\"layout-sidenav\">\n        <app-milestone-sidebar [steps]=\"sidebarSteps\" [activeIndex]=\"activeIndex\" />\n      <\/div>\n\n      <div class=\"layout-content\">\n        <!-- Original card, replaced by the Figma redesign below. Kept for reference.\n        <app-product-and-fees><\/app-product-and-fees>\n        -->\n        <app-products-pricing-card><\/app-products-pricing-card>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/main>\n"}, {"path": "product-and-fees.component.scss", "code": "@use './styles/color-tokens' as *;\n@use './styles/variables' as var;\n@import 'bootstrap/scss/functions';\n@import 'bootstrap/scss/variables';\n@import 'bootstrap/scss/mixins';\n\n\n$sidenav-breakpoint: 1370px;\n\n// \u2500\u2500 VendorOnBoardingSpa src/styles.scss globals \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// VOB applies these app-wide after the exos theme. They are scoped to this\n// page's root via :where() so they keep the original selector specificity\n// (h1/p/label = 0,0,1) and don't leak into the rest of the prototypes app.\n.vob-pf-root {\n  --bs-body-color: #05152a;\n  color: var(--bs-body-color);\n}\n\n::ng-deep :where(.vob-pf-root) :is(h1, h2, h3, h4, h5, h6, p) {\n  color: #05152a;\n}\n\n::ng-deep :where(.vob-pf-root) label {\n  margin-bottom: .375rem;\n}\n\n$signup-circles-min-width: 1450px;\n\n\n\n\n\n.signup-circle,\n.signup-circle-bottom {\n  display: block;\n  z-index: -1;\n  pointer-events: none;\n  user-select: none;\n}\n\n.signup-circle {\n  position: fixed;\n  top: 50%;\n  left: 0;\n  transform: translateY(-50%);\n  width: 198px;\n  height: 395px;\n}\n\n.signup-circle-bottom {\n  position: absolute;\n  right: 0;\n  bottom: 0;\n  width: 215px;\n  height: 253px;\n}\n\n\n@media (max-width: 767.98px) {\n  .signup-circle,\n  .signup-circle-bottom {\n    display: none;\n  }\n}\n\n.layout-shell {\n  width: 100%;\n  min-height: 100vh;\n  min-height: 100dvh;\n  background: var.$gradient-04;\n  display: flex;\n  flex-direction: column;\n  box-sizing: border-box;\n  overflow-x: clip;\n  position: relative;\n  z-index: 0;\n}\n\n\n.layout-header {\n  display: block;\n  width: 100%;\n  position: sticky;\n  top: 0;\n  z-index: 100;\n\n  @media (min-width: $sidenav-breakpoint) {\n    display: none;\n\n    &.is-progress {\n      display: block;\n    }\n  }\n}\n\n\n.layout-body {\n  flex: 1 1 auto;\n  display: flex;\n  align-items: flex-start;\n  justify-content: center;\n  padding: 32px 16px 48px;\n  box-sizing: border-box;\n  @include media-breakpoint-up(md) {\n    padding-top: 60px;\n    padding-inline: 68px;\n    padding-bottom: 80px;\n  }\n\n  &.is-progress {\n    padding: 32px 16px 40px;\n    @media (min-width: 770px) {\n      padding: 64px 68px 80px 68px;\n    }\n\n    // The ending screen has its own gutters and starts one breakpoint earlier.\n    // Needs both classes, so plain /progress above keeps its 770px rule intact.\n    &.is-ending-screen {\n      @media (min-width: 757px) {\n        padding: 40px 68px 80px;\n      }\n    }\n  }\n}\n\n\n.layout-container {\n  width: 100%;\n  min-width: 0;\n  display: flex;\n  align-items: flex-start;\n\n  @media (min-width: $sidenav-breakpoint) {\n    max-width: 1168px;\n    gap: 48px;\n    align-items: stretch;\n    min-height: 695px;\n  }\n}\n\n\n// The ending screen runs wider than the 1168px measure the stepper screens use.\n// The marker sits on .layout-body, not .layout-shell, because the shell can't\n// tell the branch from the URL - see ProgressLayoutState.\n@media (min-width: $sidenav-breakpoint) {\n  .layout-body.is-ending-screen .layout-container {\n    max-width: 1300px;\n  }\n}\n\n\n.layout-sidenav {\n  display: none;\n\n  @media (min-width: $sidenav-breakpoint) {\n    display: block;\n    flex: none;\n    width: 360px;\n  }\n}\n\n\n.layout-content {\n  flex: 1 1 auto;\n  min-width: 0;\n  display: flex;\n  justify-content: center;\n}\n\n\n@media (max-width: 767.98px) {\n  .layout-shell.is-coverage {\n    background: none;\n    height: 100vh;\n    height: 100dvh;\n    overflow: hidden;\n\n    .layout-header {\n      position: relative;\n      // Above the county search sheet (z-index: 6 in coverage.scss) so the\n      // hamburger menu stays clickable/visible over it on mobile.\n      z-index: 7;\n    }\n\n    .signup-circle,\n    .signup-circle-bottom {\n      z-index: -1;\n    }\n\n    .layout-body {\n      padding: 0;\n    }\n  }\n}\n\n\n@media (min-width: 611px) and (max-width: $sidenav-breakpoint - 1) {\n  .layout-shell.is-availability .layout-body {\n    padding-inline: 68px;\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-availability {\n    .layout-body {\n      padding: 48px 40px;\n    }\n\n    .layout-container {\n      max-width: 1620px;\n    }\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-w9 {\n    .layout-body {\n      padding: 100px;\n    }\n\n    .layout-container {\n      min-height: 695px;\n      align-items: stretch;\n    }\n\n    .layout-content {\n      align-items: stretch;\n    }\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-profile-photo {\n    .layout-body {\n      padding: 100px;\n    }\n\n    .layout-container {\n      min-height: 695px;\n      align-items: stretch;\n    }\n\n    .layout-content {\n      align-items: stretch;\n    }\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-geo-comp .layout-body,\n  .layout-shell.is-ach .layout-body {\n    padding: 100px;\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-parev1832 {\n    .layout-body {\n      padding: 100px;\n    }\n\n    .layout-container {\n      min-height: 695px;\n      align-items: stretch;\n    }\n\n    .layout-content {\n      align-items: stretch;\n    }\n  }\n}\n\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-w9.is-sign-step .layout-body,\n  .layout-shell.is-ach.is-sign-step .layout-body,\n  .layout-shell.is-parev1832.is-sign-step .layout-body,\n  .layout-shell.is-geo-comp.is-sign-step .layout-body {\n    padding: 48px 40px;\n  }\n\n  .layout-shell.is-w9.is-sign-step .layout-container,\n  .layout-shell.is-ach.is-sign-step .layout-container,\n  .layout-shell.is-parev1832.is-sign-step .layout-container,\n  .layout-shell.is-geo-comp.is-sign-step .layout-container {\n    max-width: none;\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-coverage {\n    .layout-body {\n      padding: 48px 40px;\n    }\n\n    .layout-container {\n      max-width: 1620px;\n    }\n  }\n}\n\n\n@media (min-width: $sidenav-breakpoint) {\n  .layout-shell.is-licenses .layout-body {\n    padding: 100px;\n  }\n\n  .layout-shell.is-my-info .layout-body,\n  .layout-shell.is-product-fees .layout-body {\n    padding: 48px 100px;\n  }\n}\n"}, {"path": "product-and-fees.component.ts", "code": "import { Component, ChangeDetectionStrategy, OnDestroy, inject } from '@angular/core';\nimport { ThemeService, ThemeName } from '../../../services/theme.service';\nimport { MilestoneHeaderComponent } from './milestone-header/milestone-header';\nimport { MilestoneSidebarComponent } from './milestone-sidebar/milestone-sidebar';\n// Original card \u2013 commented out in favour of the redesign (ProductsPricingCardComponent).\n// import { ProductAndFeesCardComponent } from './product-and-fees-card/product-and-fees-card';\nimport { ProductsPricingCardComponent } from './products-pricing-card/products-pricing-card';\nimport { StepIconItem } from './step-icon-header/step-icon-header';\nimport { HEADER_STEPS, SIDEBAR_STEPS, ACTIVE_STEP_INDEX } from './product-and-fees.data';\n\n/**\n * UI-only replica of the VendorOnBoardingSpa Products & Fees screen.\n * VendorOnBoardingSpa ships the exos *external* theme, so the page switches to\n * it while mounted and restores whatever theme was active before on leave.\n */\n@Component({\n  selector: 'app-onboarding-layout',\n  standalone: true,\n  imports: [MilestoneHeaderComponent, MilestoneSidebarComponent, /* ProductAndFeesCardComponent, */ ProductsPricingCardComponent],\n  templateUrl: './product-and-fees.component.html',\n  styleUrl: './product-and-fees.component.scss',\n  changeDetection: ChangeDetectionStrategy.OnPush,\n})\nexport class ProductAndFeesComponent implements OnDestroy {\n  private readonly themeService = inject(ThemeService);\n  private readonly previousTheme: ThemeName = this.themeService.active();\n\n  protected readonly steps: StepIconItem[] = HEADER_STEPS;\n  protected readonly sidebarSteps: StepIconItem[] = SIDEBAR_STEPS;\n  protected readonly activeIndex = ACTIVE_STEP_INDEX;\n\n  constructor() {\n    this.themeService.setTheme('external');\n  }\n\n  ngOnDestroy(): void {\n    this.themeService.setTheme(this.previousTheme);\n  }\n}\n"}, {"path": "product-and-fees.data.ts", "code": "// Static display data for the UI-only Products & Fees replica.\n// In VendorOnBoardingSpa these come from the onboarding API; here they are\n// hard-coded so the page renders in a realistic, fully-populated state.\n\nimport { StepIconItem } from './step-icon-header/step-icon-header';\n\n// \u2500\u2500 Models (trimmed copy of VOB product-fees-models.ts) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport type SectionType = 'multiColumn' | 'single';\nexport type AdjustmentType = 'Add' | 'Subtract';\n\nexport interface FeeValue {\n  isEnabled: boolean;\n  fee: number | null;\n}\n\nexport interface InspectionType {\n  key: string;\n  displayName: string;\n}\n\nexport interface MultiColumnFeeRow {\n  id: string;\n  name: string;\n  displayOrder: number;\n  fees: Record<string, FeeValue>;\n}\n\nexport interface SingleFeeRow {\n  id: string;\n  name: string;\n  displayOrder: number;\n  isEnabled: boolean;\n  fee: number | null;\n}\n\nexport interface ProductFeeSection {\n  sectionId: string;\n  sectionName: string;\n  sectionType: SectionType;\n  displayOrder: number;\n  inspectionTypes: InspectionType[] | null;\n  sections: MultiColumnFeeRow[] | null;\n  fees: SingleFeeRow[] | null;\n}\n\nexport interface CountyFeeAdjustment {\n  adjustmentType: AdjustmentType;\n  fee?: number;\n}\n\nexport interface CountyFee {\n  state: string;\n  county: string;\n  countyName: string | null;\n  interior: CountyFeeAdjustment;\n  exterior: CountyFeeAdjustment;\n}\n\nexport interface CoverageArea {\n  countyName: string;\n  state: string;\n}\n\n// \u2500\u2500 Milestone steps \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Products & Fees is active; the three steps before it are complete.\n\nexport const ACTIVE_STEP_INDEX = 3;\n\nexport const HEADER_STEPS: StepIconItem[] = [\n  { img: 'license', label: 'License', isFilled: true },\n  { img: 'my-info', label: 'Info & Docs', isFilled: true },\n  { img: 'coverage', label: 'Coverage', isFilled: true },\n  { img: 'product-and-fees', label: 'Products & Fees', isFilled: false },\n  { img: 'availability', label: 'Your Availability', isFilled: false },\n];\n\nexport const SIDEBAR_STEPS: StepIconItem[] = [\n  { img: 'license', label: 'Appraiser License Verification', isFilled: true },\n  { img: 'my-info', label: 'Info & Documents', isFilled: true },\n  { img: 'coverage', label: 'Coverage Area', isFilled: true },\n  { img: 'product-and-fees', label: 'Products & Fees', isFilled: false },\n  { img: 'availability', label: 'Your Availability', isFilled: false },\n];\n\n// \u2500\u2500 Product fee sections \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nconst INSPECTION_TYPES: InspectionType[] = [\n  { key: 'interior', displayName: 'Interior' },\n  { key: 'exterior', displayName: 'Exterior' },\n];\n\nfunction multiRow(id: string, name: string, displayOrder: number): MultiColumnFeeRow {\n  return {\n    id,\n    name,\n    displayOrder,\n    fees: {\n      interior: { isEnabled: true, fee: null },\n      exterior: { isEnabled: true, fee: null },\n    },\n  };\n}\n\nfunction singleRow(id: string, name: string, displayOrder: number): SingleFeeRow {\n  return { id, name, displayOrder, isEnabled: true, fee: null };\n}\n\nexport function createProductFeeSections(): ProductFeeSection[] {\n  return [\n    {\n      sectionId: 'core-products',\n      sectionName: 'Core Products',\n      sectionType: 'multiColumn',\n      displayOrder: 1,\n      inspectionTypes: INSPECTION_TYPES,\n      sections: [\n        multiRow('sf-detached', 'Single Family - Detached', 1),\n        multiRow('sf-condo', 'Single Family - Condo', 2),\n        multiRow('sf-coop', 'Single Family - Co-Op', 3),\n        multiRow('multi-family', 'Multi Family', 4),\n        multiRow('land', 'Land', 5),\n        multiRow('field-review', 'Field Review', 6),\n        multiRow('recert-updates', 'Recertification & Updates', 7),\n      ],\n      fees: null,\n    },\n    {\n      sectionId: 'additional-products',\n      sectionName: 'Additional Products',\n      sectionType: 'single',\n      displayOrder: 2,\n      inspectionTypes: null,\n      sections: null,\n      fees: [\n        singleRow('desktop-gse', 'Desktop / Hybrid - GSE Compliant', 1),\n        singleRow('desktop-limited', 'Desktop / Hybrid - Limited Scope', 2),\n      ],\n    },\n    {\n      sectionId: 'add-ons',\n      sectionName: 'Add-On Pricing Considerations (Optional)',\n      sectionType: 'single',\n      displayOrder: 3,\n      inspectionTypes: null,\n      sections: null,\n      fees: [\n        singleRow('as-is', 'As Is & As Subject To Values', 1),\n        singleRow('rent-schedule', 'Rent Schedule / Operating Income Statement', 2),\n        singleRow('fha-usda', 'FHA / USDA', 3),\n        singleRow('renovation', 'Renovation', 4),\n        singleRow('manufactured-home', 'Manufactured Home', 5),\n        singleRow('reo-addendum', 'REO Addendum', 6),\n        singleRow('retroactive-value', 'Retroactive Value', 7),\n      ],\n    },\n  ];\n}\n\n// \u2500\u2500 Coverage areas (county dropdown options) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport const COVERAGE_AREAS: CoverageArea[] = [\n  { countyName: 'Allegheny', state: 'PA' },\n  { countyName: 'Butler', state: 'PA' },\n  { countyName: 'Beaver', state: 'PA' },\n  { countyName: 'Washington', state: 'PA' },\n  { countyName: 'Westmoreland', state: 'PA' },\n];\n\nexport function createEmptyCountyFee(): CountyFee {\n  return {\n    county: '',\n    countyName: '',\n    state: '',\n    interior: { adjustmentType: 'Add' },\n    exterior: { adjustmentType: 'Add' },\n  };\n}\n\n// \u2500\u2500 Products & Pricing card (Figma \"Sams-Vibe\" 683:8694 et al.) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Static display data for the redesigned county \u00d7 product pricing grid.\n\nexport interface PricingProduct {\n  key: string;\n  name: string;\n  description: string;\n}\n\nexport const PRICING_PRODUCTS: PricingProduct[] = [\n  { key: 'interior-pcr', name: 'Interior PCR / Disaster Condition', description: 'Description of Interior Property Condition Report / Disaster Condition Report' },\n  { key: 'exterior-pcr', name: 'Exterior PCR / Disaster Condition', description: 'Descripti        <p class=\"fw-bold text-secondary\">support@exostechnology.com<\/p>\n        <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n"}, {"path": "help-modal/help-modal.scss", "code": "@import 'bootstrap/scss/functions';\n@import 'bootstrap/scss/variables';\n@import 'bootstrap/scss/mixins';\n@import '../styles/variables';\n\n\n.modal {\n  background: $capture-modal-backdrop-background;\n  backdrop-filter: blur(24px);\n  padding: 24px;\n}\n\n.modal-content {\n  flex: 1 1 0;\n  display: flex;\n  flex-direction: column;\n  gap: 32px;\n  min-height: 0;\n  overflow-y: auto;\n  padding: 28px;\n\n  p {\n    font-size: 16px;\n    margin-bottom: 0;\n    margin-top: 0;\n    color: var(--text-default-tertiary, #{$capture-modal-text-tertiary});\n  }\n}\n\n@media (max-width: 640px) {\n  .modal {\n    padding: 12px;\n  }\n\n  .modal-content {\n    padding: 18px;\n\n    p {\n      font-size: 14px;\n    }\n  }\n}\n\n.help-modal {\n\n  .modal-content {\n\n    .modal-header {\n      padding: 0px;\n\n      .modal-title {\n        font-size: 24px;\n      }\n    }\n\n    .modal-body {\n      padding: 0px;\n    }\n\n    .modal-footer {\n      padding: 0px;\n      justify-content: space-between;\n    }\n  }\n}\n\n.icon-message, .icon-cellphone {\n  background: $color-action-light;\n  font-size: 24px;\n  padding: 5px;\n  border-radius: 4px;\n}"}, {"path": "help-modal/help-modal.ts", "code": "import { ChangeDetectionStrategy, Component, DOCUMENT, ElementRef, ViewChild, inject, signal } from '@angular/core';\n\n// Bootstrap's JS bundle isn't loaded in the prototypes app, so this replicates\n// what `new bootstrap.Modal(el, { backdrop: false }).show()/hide()` does to the\n// DOM: display:block, then `.show` on the next frame so the fade transition runs.\nconst FADE_MS = 150;\n\n@Component({\n  selector: 'app-help-modal',\n  standalone: true,\n  templateUrl: './help-modal.html',\n  styleUrl: './help-modal.scss',\n  changeDetection: ChangeDetectionStrategy.OnPush\n})\nexport class HelpModalComponent {\n  @ViewChild('helpModal') modalRef!: ElementRef<HTMLElement>;\n\n  protected readonly displayed = signal(false);\n  protected readonly shown = signal(false);\n  private hideTimer?: ReturnType<typeof setTimeout>;\n  private readonly doc = inject(DOCUMENT);\n\n  open(): void {\n    clearTimeout(this.hideTimer);\n    this.displayed.set(true);\n    this.lockBodyScroll(true);\n    requestAnimationFrame(() => {\n      this.shown.set(true);\n      this.modalRef?.nativeElement.focus();\n    });\n  }\n\n  close(): void {\n    if (!this.displayed()) {\n      return;\n    }\n    this.shown.set(false);\n    this.hideTimer = setTimeout(() => {\n      this.displayed.set(false);\n      this.lockBodyScroll(false);\n    }, FADE_MS);\n  }\n\n  // Mirrors Bootstrap's ScrollBarHelper: hide body overflow and pad for the scrollbar.\n  private lockBodyScroll(lock: boolean): void {\n    const body = this.doc.body;\n    if (lock) {\n      const scrollbarWidth = Math.abs(window.innerWidth - this.doc.documentElement.clientWidth);\n      body.classList.add('modal-open');\n      body.style.overflow = 'hidden';\n      body.style.paddingRight = scrollbarWidth ? `${scrollbarWidth}px` : '';\n    } else {\n      body.classList.remove('modal-open');\n      body.style.overflow = '';\n      body.style.paddingRight = '';\n    }\n  }\n}\n"}, {"path": "milestone-header/milestone-header.html", "code": "<div class=\"nav-shell\">\n<nav>\n  <img ngSrc=\"assets/images/general/sl-logo-only.svg\" width=\"24\" height=\"32\" alt=\"ServiceLink\" class=\"signup-logo\" />\n\n  <app-step-icon-header class=\"d-none d-md-flex\" [steps]=\"steps()\" [activeIndex]=\"activeIndex()\"\n    (stepClick)=\"onProgressStepClick($event)\" />\n\n  <button type=\"button\" class=\"mobile-step-toggle d-flex d-md-none\" (click)=\"toggleMobileSteps()\"\n    [attr.aria-expanded]=\"mobileStepsOpen()\" aria-controls=\"mobile-steps-panel\">\n    @if (steps()[activeIndex()].isFilled) {\n    <img src=\"assets/ us: 6px;\n    text-align: left;\n    cursor: pointer;\n\n    &:focus-visible {\n        outline: 2px solid var(--exos-new-primary);\n        outline-offset: 2px;\n    }\n}\n\n.mobile-step-icon-label {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n}\n\n.mobile-step-icon-col {\n    display: flex;\n    flex-shrink: 0;\n\n    .step-icon,\n    .step-icon-img,\n    .step-icon-complete {\n        width: 26px;\n        height: 26px;\n    }\n}\n\n.mobile-connector-line {\n    width: 1.5px;\n    height: 28px;\n    border-radius: 1000px;\n    background: #bfcad5;\n    margin-top: 4px;\n    margin-left: 12px;\n\n    &.line-done {\n        background: $milestone-complete-icon;\n    }\n}\n\n.mobile-step-label {\n    font-size: 14px;\n    font-weight: 700;\n    color: $color-text-secondary;\n    line-height: 1.4;\n\n    @include media-breakpoint-up(md) {\n        font-size: 16px;\n    }\n}\n\n\n.mobile-menu-panel {\n    padding: 0;\n}\n\n\n.hamburger-panel {\n    position: absolute;\n    top: calc(100% + 8px);\n    left: 0;\n    right: 0;\n    z-index: 999;\n    display: flex;\n    flex-direction: column;\n    gap: 16px;\n    padding: 16px 24px;\n    border: 1px solid $color-border-lighter;\n    border-radius: 16px;\n    background: rgba(255, 255, 255, 0.51);\n    backdrop-filter: blur(28px);\n    box-shadow: 0 12px 30px 0 rgba($color-shadow-strong, .12);\n\n}\n\nnav.is-progress ~ .hamburger-panel {\n    @media (min-width: 800px) {\n        display: none;\n    }\n}\n\n\n\n@media (min-width: 869px) {\n    .hamburger-panel {\n        left: auto;\n        width: 263px;\n    }\n}\n\n.hamburger-panel-actions {\n    display: flex;\n    flex-direction: column;\n}\n\n.hamburger-panel-row {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    width: calc(100% + 16px);\n    margin-inline: -8px;\n    padding: 12px 8px;\n    background: none;\n    border: none;\n    border-radius: 8px;\n    font-size: 14px;\n    font-weight: 700;\n    line-height: 24px;\n    color: $color-text-secondary;\n    text-align: left;\n    cursor: pointer;\n\n    @include media-breakpoint-up(md) {\n        font-size: 16px;\n    }\n\n    &:hover {\n        background-color: var(--exos-new-bg-action-light);\n    }\n\n    &:focus-visible {\n        outline: 2px solid var(--exos-new-primary);\n        outline-offset: -2px;\n    }\n\n    @media (min-width: 869px) {\n        font-weight: 400;\n    }\n}\n\n.hamburger-panel-icon {\n    font-size: 24px;\n    color: var(--exos-new-primary);\n    flex-shrink: 0;\n}\n\n.mobile-menu-row {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    width: 100%;\n    padding: 16px;\n    background: none;\n    border: none;\n    border-bottom: 1px solid color-mix(in srgb, var(--exos-new-border-default-light) 30%, transparent);\n    font-size: 14px;\n    font-weight: 700;\n    color: var(--exos-new-text-body-primary);\n    text-align: left;\n    cursor: pointer;\n\n    @include media-breakpoint-up(md) {\n        font-size: 16px;\n    }\n\n    &:last-child {\n        border-bottom: none;\n    }\n\n    &.active {\n        color: var(--exos-new-primary);\n    }\n\n    &:focus-visible {\n        outline: 2px solid var(--exos-new-primary);\n        outline-offset: -2px;\n    }\n}\n\n.action-buttons-container {\n    display: none;\n    align-items: center;\n    gap: 24px;\n}\n\n.action-button {\n    display: flex;\n    align-items: center;\n    gap: 9px;\n    background: none;\n    border: none;\n    padding: 0;\n    font-size: 12px;\n    font-weight: 700;\n    line-height: 16px;\n    color: $color-action-primary;\n    cursor: pointer;\n    text-transform: uppercase;\n    letter-spacing: 1.2px;\n\n\n\n    &:focus-visible {\n        outline: 2px solid var(--exos-new-primary);\n        outline-offset: 2px;\n    }\n}\n\n.action-button-icon {\n    font-size: 16px;\n    color: var(--exos-new-primary);\n    flex-shrink: 0;\n}\n\nnav.is-progress {\n    align-items: center;\n    padding: 16px 24px;\n    background: none;\n\n    @media (min-width: 770px) {\n        padding: 24px 32px;\n        background: rgba($color-surface-white, 0.01);\n        box-shadow: none;\n        backdrop-filter: none;\n\n        &.is-desktop-progress-scrolled {\n            box-shadow: 0 12px 30px 0 rgba($color-shadow-strong, 0.12);\n            backdrop-filter: blur(48px);\n        }\n\n        .mobile-hamburger {\n            display: none !important;\n        }\n\n        .action-buttons-container {\n            display: flex;\n        }\n    }\n}\n\n\n@media (min-width: 768px) and (max-width: 868.98px) {\n    nav > app-step-icon-header {\n        display: none !important;\n    }\n\n    .mobile-step-toggle[aria-controls=\"mobile-steps-panel\"] {\n        display: flex !important;\n    }\n\n    #mobile-steps-panel {\n        display: block !important;\n    }\n\n    .item-tab {\n        display: none !important;\n    }\n\n    .mobile-step-toggle[aria-controls=\"mobile-sections-panel\"] {\n        display: flex !important;\n    }\n\n    #mobile-sections-panel {\n        display: block !important;\n    }\n}\n\n@media (min-width: 869px) and (max-width: 1199.98px) {\n    nav:has(.item-tab .nav-item:nth-child(4)) {\n        padding: 16px 24px;\n        gap: 16px;\n\n        .item-tab .nav-link {\n            padding: 10px 16px;\n        }\n    }\n}\n\n.item-tab {\n    background-color: rgba($color-surface-white, .52);\n    padding: 8px;\n    border-radius: 100px;\n    width: fit-content;\n    max-width: 100%;\n    margin: 0 auto;\n    display: flex;\n    flex-wrap: nowrap;\n    justify-content: center;\n\n    .nav-item {\n        flex: 0 1 auto;\n        min-width: 0;\n    }\n\n    .nav-link {\n        width: 100%;\n        text-align: center;\n        white-space: nowrap;\n        padding: 10px 20px;\n        border-radius: 100px;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        gap: 8px;\n        color: var(--exos-new-text-body-secondary);\n        background: none;\n        border: 1px solid transparent;\n        cursor: pointer;\n\n        &.active {\n            background-color: $color-surface-white;\n            border-color: var(--exos-new-border-action-lighter, #eff7fe);\n            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.1);\n            color: $color-action-primary;\n        }\n    }\n}\n\n.item-tab .nav-link-icon {\n    --step-icon-size: 22px;\n    --step-icon-font-size: 16px;\n    width: 22px;\n    height: 22px;\n}"}, {"path": "milestone-header/milestone-header.ts", "code": "import { Component, ChangeDetectionStrategy, input, signal } from '@angular/core';\nimport { NgOptimizedImage } from '@angular/common';\nimport { HelpModalComponent } from '../help-modal/help-modal';\nimport { StepIconHeaderComponent, StepIconItem } from '../step-icon-header/step-icon-header';\n\n// UI-only copy of VOB's MilestoneHeaderComponent, fixed to the Products & Fees\n// route (stepper visible, no nav tabs, not the progress screen). Navigation,\n// progress fetching and logout are intentionally left out.\n@Component({\n    selector: 'app-milestone-header',\n    standalone: true,\n    imports: [NgOptimizedImage, HelpModalComponent, StepIconHeaderComponent],\n    templateUrl: './milestone-header.html',\n    styleUrl: './milestone-header.scss',\n    changeDetection: ChangeDetectionStrategy.OnPush\n})\nexport class MilestoneHeaderComponent {\n    readonly steps = input.required<StepIconItem[]>();\n    readonly activeIndex = input(0);\n\n    protected readonly mobileStepsOpen = signal(false);\n    protected readonly mobileMenuOpen = signal(false);\n\n    toggleMobileSteps(): void {\n        this.mobileStepsOpen.update(open => !open);\n        // Only one dropdown panel at a time \u2014 they share the same anchor area.\n        if (this.mobileStepsOpen()) {\n            this.mobileMenuOpen.set(false);\n        }\n    }\n\n    onMobileStepClick(): void {\n        this.mobileStepsOpen.set(false);\n    }\n\n    onProgressStepClick(_index: number): void {\n        // Navigation only in the real app.\n    }\n\n    toggleMobileMenu(): void {\n        this.mobileMenuOpen.update(open => !open);\n        if (this.mobileMenuOpen()) {\n            this.mobileStepsOpen.set(false);\n        }\n    }\n\n    onMobileMenuHelp(helpModal: HelpModalComponent): void {\n        this.mobileMenuOpen.set(false);\n        helpModal.open();\n    }\n\n    closeMobileMenu(): void {\n        this.mobileMenuOpen.set(false);\n    }\n}\n"}, {"path": "milestone-sidebar/milestone-sidebar.html", "code": "<aside class=\"sidebar\">\n  <img src=\"assets/images/signup/logo.svg\" width=\"156\" height=\"33\" alt=\"ServiceLink\" class=\"sidebar-logo\" />\n\n  <app-step-icon-header class=\"sidebar-steps\" orientation=\"vertical\" [steps]=\"steps()\"\n    [activeIndex]=\"activeIndex()\" />\n\n  <div class=\"sidebar-footer\">\n    <button type=\"button\" class=\"sidebar-footer-row\" (click)=\"onHelpClick()\">\n      <span class=\"icon-question-circle sidebar-footer-icon text-primary\" aria-hidden=\"true\"><\/span>\n      Help\n    <\/button>\n    <button type=\"button\" class=\"sidebar-footer-row\">\n      <span class=\"icon-home sidebar-footer-icon text-primary\" aria-hidden=\"true\"><\/span>\n      Progress Dashboard\n    <\/button>\n    <button type=\"button\" class=\"sidebar-footer-row\">\n      <span class=\"icon-box-arrow-right text-primary sidebar-footer-icon\" aria-hidden=\"true\"><\/span>\n      Logout\n    <\/button>\n  <\/div>\n<\/aside>\n\n<app-help-modal />\n"}, {"path": "milestone-sidebar/milestone-sidebar.scss", "code": "@import '../styles/color-tokens';\n\n:host {\n    display: block;\n    width: 100%;\n    height: 100%;\n}\n\n.sidebar {\n    width: 100%;\n    height: 100%;\n    max-height: 895px;\n    position: sticky;\n    top: 48px;\n    box-sizing: border-box;\n    display: flex;\n    flex-direction: column;\n    justify-content: space-between;\n    padding-block: 32px;\n    border-radius: 24px;\n    overflow: clip;\n    background:\n        linear-gradient(180deg, #F2F8FD 4.5167%, #FAFCFF 13.266%),\n        linear-gradient(90deg, rgba(255, 255, 255, 0.01) 0%, rgba(255, 255, 255, 0.01) 100%);\n    backdrop-filter: blur(24px);\n    box-shadow: 0 12px 30px 0 rgba($color-shadow-strong, .12);\n}\n\n// /w9, /ach, /parev1832 and /geo-competency-form. These four run two padding\n// states: 100px while the form is being filled in, dropping to 48px on the PDF\n// review screen, where SignStepUiService flips .is-sign-step onto the shell\n// (see the matching .layout-body rules in onboarding-layout.scss). The rail has\n// to track both \u2014 the sticky offset matches the body padding so it does not\n// jump on first scroll, and the height budget is the viewport less that padding\n// top and bottom, so the rail's bottom edge lands on the card's however far the\n// form scrolls.\n//\n// A max-height cap rather than the fixed height /my-info uses below: the w9 and\n// ACH cards stretch to the container, so a fixed rail height would push the\n// container taller and stretch a short business-type 'select' card to fill the\n// screen with it. A cap leaves the columns equal-height while the card is short\n// and only bites once the form outgrows the viewport.\n@media (min-width: 1370px) {\n    :host-context(.layout-shell.is-w9) .sidebar,\n    :host-context(.layout-shell.is-ach) .sidebar,\n    :host-context(.layout-shell.is-parev1832) .sidebar,\n    :host-context(.layout-shell.is-geo-comp) .sidebar {\n        top: 100px;\n        max-height: calc(100vh - 200px);\n        max-height: calc(100dvh - 200px);\n    }\n\n    // Compound selectors rather than .is-sign-step alone so this outranks the\n    // per-route rule above on specificity instead of on source order, matching\n    // how onboarding-layout.scss pairs the two.\n    :host-context(.layout-shell.is-w9.is-sign-step) .sidebar,\n    :host-context(.layout-shell.is-ach.is-sign-step) .sidebar,\n    :host-context(.layout-shell.is-parev1832.is-sign-step) .sidebar,\n    :host-context(.layout-shell.is-geo-comp.is-sign-step) .sidebar {\n        top: 48px;\n        max-height: calc(100vh - 96px);\n        max-height: calc(100dvh - 96px);\n    }\n\n    // The 100px state leaves the tightest budget of any route, so it drops under\n    // the rail's intrinsic height on shorter screens. .sidebar-steps is the only\n    // child that flexes, so scroll the list rather than let .sidebar's\n    // `overflow: clip` cut rows off the bottom.\n    :host-context(.layout-shell.is-w9) .sidebar-steps,\n    :host-context(.layout-shell.is-ach) .sidebar-steps,\n    :host-context(.layout-shell.is-parev1832) .sidebar-steps,\n    :host-context(.layout-shell.is-geo-comp) .sidebar-steps {\n        min-height: 0;\n        overflow-y: auto;\n    }\n}\n\n// /my-info and /product-and-fees: the card grows past the fold and the page\n// scrolls, so the rail is sized to the viewport rather than to the (unbounded)\n// content column \u2014 a fixed height instead of the usual `100%` + 895px cap,\n// which on any viewport shorter than 943px ran the rail off the bottom of the\n// screen. 96px = the shell's 48px body padding top and bottom (both routes\n// share the `48px 100px` rule in onboarding-layout.scss), which is also the\n// sticky offset, so the rail keeps an even 48px gap top and bottom at every\n// scroll position and its bottom edge lands on the card's once the card stops.\n@media (min-width: 1370px) {\n    :host-context(.layout-shell.is-my-info) .sidebar,\n    :host-context(.layout-shell.is-product-fees) .sidebar {\n        height: calc(100vh - 96px);\n        height: calc(100dvh - 96px);\n        max-height: none;\n    }\n\n    // The step list is the only part that flexes, so it absorbs the squeeze on\n    // viewports too short for the rail's intrinsic ~637px. Scroll it rather\n    // than let .sidebar's `overflow: clip` cut the rows off.\n    :host-context(.layout-shell.is-my-info) .sidebar-steps,\n    :host-context(.layout-shell.is-product-fees) .sidebar-steps {\n        min-height: 0;\n        overflow-y: auto;\n    }\n}\n\n.sidebar-logo {\n    flex-shrink: 0;\n    width: 156px;\n    height: auto;\n    display: block;\n    margin-inline: 32px;\n    margin-block-end: 48px;\n}\n\n.sidebar-steps {\n    flex: 1 1 auto;\n    padding-inline: 32px;\n    // Sidebar icons/labels read larger and bolder than the horizontal header's.\n    --step-icon-size: 36px;\n    --step-icon-font-size: 24px;\n    --step-icon-label-gap: 16px;\n    --step-row-gap: 40px;\n    --step-label-font-size: 16px;\n    --step-label-font-weight: 700;\n    --step-label-color: var(--exos-new-text-body-primary);\n}\n\n// Nav-tab steps (W-9, Profile Photo, Geo-Competency) don't\n// use the connector line between icons, but keep the same grey circle badge\n// as the license/coverage list. Set as a custom property (not a descendant\n// selector) since .step-icon-container lives inside app-step-icon-header's\n// own template \u2014 view encapsulation blocks descendant selectors from\n// reaching in, but custom properties still cascade.\n.sidebar-nav-steps {\n    // --step-connector-display: none;\n}\n\n.sidebar-footer {\n    flex-shrink: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n    padding-inline: 32px;\n}\n\n.sidebar-footer-row {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    padding: 12px 8px;\n    border-radius: 8px;\n    background: none;\n    border: none;\n    font-size: 16px;\n    line-height: 24px;\n    color: var(--exos-new-text-body-primary);\n    text-align: left;\n    cursor: pointer;\n\n    &:hover {\n        background-color: var(--exos-new-bg-action-light);\n    }\n\n    &:focus-visible {\n        outline: 2px solid var(--exos-new-primary);\n        outline-offset: -2px;\n    }\n}\n\n.sidebar-footer-icon {\n    font-size: 24px;\n    color: var(--exos-new-text-body-primary);\n}\n"}, {"path": "milestone-sidebar/milestone-sidebar.ts", "code": "import { Component, ChangeDetectionStrategy, input, viewChild } from '@angular/core';\nimport { HelpModalComponent } from '../help-modal/help-modal';\nimport { StepIconHeaderComponent, StepIconItem } from '../step-icon-header/step-icon-header';\n\n// UI-only copy of VOB's MilestoneSidebarComponent on the Products & Fees route.\n// Step navigation, Progress Dashboard and Logout do nothing here.\n@Component({\n    selector: 'app-milestone-sidebar',\n    standalone: true,\n    imports: [HelpModalComponent, StepIconHeaderComponent],\n    templateUrl: './milestone-sidebar.html',\n    styleUrl: './milestone-sidebar.scss',\n    changeDetection: ChangeDetectionStrategy.OnPush\n})\nexport class MilestoneSidebarComponent {\n    readonly steps = input.required<StepIconItem[]>();\n    readonly activeIndex = input(0);\n\n    protected readonly helpModal = viewChild.required(HelpModalComponent);\n\n    onHelpClick(): void {\n        this.helpModal().open();\n    }\n}\n"}, {"path": "product-and-fees-card/product-and-fees-card.html", "code": "<div class=\"card product-and-fees-card\">\n  <div class=\"card-header\">\n    <h1>Confirm products and pricing<\/h1>\n  <\/div>\n  <div class=\"card-body\">\n    <div class=\"banner banner-primary product-and-fees-banner\" role=\"alert\">\n        <span class=\"icon-info-circle-fill\" aria-hidden=\"true\"><\/span>\n        <div class=\"text\">\n            <div>Products will be considered <span class=\"fw-bold\">quote-only<\/span> if you don\u2019t assign fees<\/div>\n        <\/div>\n    <\/div>\n    <!-- Core Products, Additional Products & Add-Ons -->\n    <div class=\"product-and-fees-section\">\n      @for (productFeeSection of productFeeSections(); track $index) {\n      @if ($index > 0) {\n      <hr />\n      }\n      <div class=\"step-header\">\n        <span aria-hidden=\"true\" class=\"question-number\">{{productFeeSection.displayOrder}}<\/span>\n        <div class=\"step-content\">\n          <h2>{{productFeeSection.sectionName}}<\/h2>\n        <\/div>\n      <\/div>\n      @if (productFeeSection?.sectionId === \"add-ons\")\n      {\n      <div class=\"step-header\">\n        <div class=\"banner banner-primary product-and-fees-banner\" role=\"alert\">\n          <span class=\"icon-info-circle-fill\" aria-hidden=\"true\"><\/span>\n          <div class=\"text\">\n            <div>These amounts will be applied <span class=\"fw-bold\">in addition<\/span> to the standard appraisal product fees you have entered above. If there is no additional charge for the considerations listed, please enter $0.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      }\n      <div class=\"product-section\" [class.multi-column]=\"productFeeSection.sectionType === 'multiColumn'\">\n\n        @if (productFeeSection.sectionType === \"multiColumn\")\n        {\n        <div class=\"product-section-header-row\">\n          <span class=\"product-section-spacer\"><\/span>\n          <div class=\"product-section-col-headers\">\n            @for (inspectionType of productFeeSection.inspectionTypes ?? []; track inspectionType.key) {\n            <span>{{ inspectionType.displayName }}<\/span>\n            }\n          <\/div>\n        <\/div>\n        @for (row of productFeeSection.sections ?? []; track row.id; let i = $index)\n        {\n        <app-section-multi-column [displayText]=\"row.name\" [code]=\"row.id\" [columns]=\"row.fees\"\n                                  [headers]=\"productFeeSection.inspectionTypes ?? []\" [showHeader]=\"i === 0\">\n        <\/app-section-multi-column>\n        }\n        }\n        @if (productFeeSection.sectionType === \"single\") {\n\n        <app-section-single [displayText]=\"productFeeSection.sectionName\" [feeRows]=\"productFeeSection.fees ?? []\">\n        <\/app-section-single>\n        }\n      <\/div>\n      }\n    <\/div>\n    <!-- Core Products, Additional Products & Add-Ons -->\n\n    <!-- County Exceptions -->\n    <hr>\n\n    <div class=\"step-header\">\n      <span aria-hidden=\"true\" class=\"question-number__align\">4<\/span>\n      <div class=\"step-content\">\n        <h2>County-Level Exceptions (Optional)<\/h2>\n        <p>You can either select <span class=\"fw-bold\">(+)<\/span> for added fee or <span class=\"fw-bold\">(-)<\/span> for\n          discounted fee<\/p>\n      <\/div>\n    <\/div>\n    @if (hasCoverageAreas())\n    {\n    <div class=\"county-exceptions\">\n      @for (row of countyFees(); track row; let i = $index)\n      {\n      <div class=\"county-exception-row\">\n        <!-- Dropdown for county select -->\n        <div class=\"county-select-wrap d-flex d-md-block align-items-center gap-4\">\n          <div class=\"county-select\">\n            <select class=\"form-select\" [attr.aria-label]=\"'County ' + row\" (change)=\"setCountyExceptionRow(row, $event)\">\n              <option [value]=\"''\" [selected]=\"!row?.county && !row?.state\">{{ countyPlaceholder() }}<\/option>\n                @for (coverageArea of coverageAreas(); track coverageArea.countyName + '-' + coverageArea.state) {\n                  <option\n                    [value]=\"toCountyOptionValue(coverageArea.countyName, coverageArea.state)\"\n                    [selected]=\"row?.county === coverageArea.countyName && row?.state === coverageArea.state\"\n                    [disabled]=\"isCountySelectedInOtherRow(coverageArea.countyName,coverageArea.state, row)\">\n                    {{ coverageArea.countyName }}-{{ coverageArea.state }}\n                  <\/option>\n                }\n            <\/select>\n          <\/div>\n          <button type=\"button\" class=\"btn county-delete-btn d-md-none\" title=\"Remove county\"\n            [attr.aria-label]=\"'Remove county ' + (i + 1)\" (click)=\"removeCountyException(row)\">\n            <span class=\"icon-trash\" aria-hidden=\"true\"><\/span>\n          <\/button>\n        <\/div>\n\n        <div class=\"county-fee-actions\">\n          <div class=\"county-fee\">\n            <div class=\"county-col\">\n              <span class=\"county-col-header\">INTERIOR<\/span>\n              <div class=\"county-controls\">\n                <div class=\"btn-group county-tab-group\" role=\"group\" [attr.aria-label]=\"'Interior fee type ' + row\">\n                  <button type=\"button\" class=\"btn county-tab-btn\" [class.active]=\"row?.interior?.adjustmentType === 'Add'\"\n                    (click)=\"setFeeAdjustmentType(row, true, 'Add')\">+<\/button>\n                  <button type=\"button\" class=\"btn county-tab-btn\" [class.active]=\"row?.interior?.adjustmentType === 'Subtract'\"\n                    (click)=\"setFeeAdjustmentType(row, true, 'Subtract')\">\u2212<\/button>\n                <\/div>\n                <div class=\"input-group county-fee-input\">\n                  <span class=\"input-group-text\">$<\/span>\n                  <input type=\"number\" class=\"form-control\" min=\"0\" step=\"0.01\" [attr.max]=\"maxFeeAmount\" [attr.aria-label]=\"'Interior fee row ' + (i + 1)\" (input)=\"row && setCountyFeeException(row, true, $event)\" (wheel)=\"$any($event.target).blur()\" [value]=\"row?.interior?.fee ?? ''\">\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"county-col\">\n              <span class=\"county-col-header\">EXTERIOR<\/span>\n              <div class=\"county-controls\">\n                <div class=\"btn-group county-tab-group\" role=\"group\" [attr.aria-label]=\"'Exterior fee type ' + row\">\n                  <button type=\"button\" class=\"btn county-tab-btn\" [class.active]=\"row?.exterior?.adjustmentType === 'Add'\"\n                    (click)=\"setFeeAdjustmentType(row, false, 'Add')\">+<\/button>\n                  <button type=\"button\" class=\"btn county-tab-btn\" [class.active]=\"row?.exterior?.adjustmentType === 'Subtract'\"\n                    (click)=\"setFeeAdjustmentType(row, false, 'Subtract')\">\u2212<\/button>\n                <\/div>\n                <div class=\"input-group county-fee-inp K / CONTINUE do nothing.\n */\n@Component({\n  selector: 'app-product-and-fees',\n  standalone: true,\n  imports: [SectionMultiColumn, SectionSingle],\n  templateUrl: './product-and-fees-card.html',\n  styleUrl: './product-and-fees-card.scss',\n  changeDetection: ChangeDetectionStrategy.OnPush,\n})\nexport class ProductAndFeesCardComponent {\n  private static readonly countyOptionDelimiter = '|';\n\n  readonly maxFeeAmount = MAX_FEE_AMOUNT;\n  readonly productFeeSections = signal<ProductFeeSection[]>(createProductFeeSections());\n  readonly coverageAreas = signal<CoverageArea[]>(COVERAGE_AREAS);\n  readonly countyFees = signal<CountyFee[]>([createEmptyCountyFee()]);\n  readonly hasCoverageAreas = computed(() => this.coverageAreas().length > 0);\n\n  // Tablet band (768-868px): the county panel's placeholder shortens to \"County\".\n  private readonly isTabletWidth = toSignal(\n    fromEvent(window, 'resize').pipe(\n      map(() => window.innerWidth >= 768 && window.innerWidth <= 868),\n      startWith(window.innerWidth >= 768 && window.innerWidth <= 868)\n    ),\n    { initialValue: window.innerWidth >= 768 && window.innerWidth <= 868 }\n  );\n  protected readonly countyPlaceholder = () => this.isTabletWidth() ? 'County' : 'Select County';\n\n  addCountyExceptionRow(): void {\n    this.countyFees.update((rows) => [...rows, createEmptyCountyFee()]);\n  }\n\n  removeCountyException(countyFee: CountyFee): void {\n    this.countyFees.update((rows) => rows.filter((row) => row !== countyFee));\n  }\n\n  setCountyExceptionRow(row: CountyFee, event: Event): void {\n    const selected = this.parseCountyOptionValue((event.target as HTMLSelectElement).value);\n\n    if (!selected) {\n      row.county = '';\n      row.countyName = '';\n      row.state = '';\n    } else if (!this.isCountySelectedInOtherRow(selected.countyName, selected.state, row)) {\n      row.county = selected.countyName;\n      row.countyName = selected.countyName;\n      row.state = selected.state;\n    }\n    this.refreshRows();\n  }\n\n  isCountySelectedInOtherRow(countyName: string, state: string, currentRow: CountyFee): boolean {\n    return this.countyFees().some(\n      (row) => row !== currentRow && row.county === countyName && row.state === state,\n    );\n  }\n\n  toCountyOptionValue(countyName: string, state: string): string {\n    return `${countyName}${ProductAndFeesCardComponent.countyOptionDelimiter}${state}`;\n  }\n\n  setCountyFeeException(row: CountyFee, isInterior: boolean, event: Event): void {\n    const result = parseFeeInput(event.target as HTMLInputElement);\n    if (result.type === 'skip') {\n      return;\n    }\n    const fee = result.type === 'value' ? result.fee : undefined;\n    (isInterior ? row.interior : row.exterior).fee = fee;\n    this.refreshRows();\n  }\n\n  setFeeAdjustmentType(row: CountyFee, isInterior: boolean, adjustmentType: AdjustmentType): void {\n    (isInterior ? row.interior : row.exterior).adjustmentType = adjustmentType;\n    this.refreshRows();\n  }\n\n  // Rows are mutated in place (keeps @for identity); clone the array to notify.\n  private refreshRows(): void {\n    this.countyFees.update((rows) => [...rows]);\n  }\n\n  private parseCountyOptionValue(value: string): { countyName: string; state: string } | null {\n    const delimiterIndex = value.lastIndexOf(ProductAndFeesCardComponent.countyOptionDelimiter);\n    if (delimiterIndex <= 0 || delimiterIndex === value.length - 1) {\n      return null;\n    }\n    const countyName = value.slice(0, delimiterIndex).trim();\n    const state = value.slice(delimiterIndex + 1).trim();\n    return countyName && state ? { countyName, state } : null;\n  }\n}\n"}, {"path": "products-pricing-card/products-pricing-card.html", "code": "<div class=\"card products-pricing-card\">\n  <div class=\"card-header\">\n    <h1>Confirm Products &amp; Pricing<\/h1>\n  <\/div>\n\n  <div class=\"card-body\">\n    <!-- Existing banner markup, new verbiage -->\n    <div class=\"banner banner-primary ing-fee-input\">\n                <span class=\"input-group-text\">$<\/span>\n                <input type=\"number\" class=\"form-control\" min=\"0\" step=\"0.01\" [value]=\"defaultFee\"\n                       [attr.aria-label]=\"county + ' ' + product.name + ' fee'\" />\n              <\/div>\n            <\/div>\n          }\n        }\n      <\/div>\n    <\/div>\n\n    <!-- \u2264767px: one block per product -->\n    <div class=\"pricing-list\">\n      @for (product of products; track product.key) {\n        <section class=\"pricing-product\">\n          <label class=\"pricing-product-heading\">\n            <input type=\"checkbox\" class=\"form-check-input\" [checked]=\"selected()[product.key]\"\n                   (change)=\"toggleProduct(product.key)\" />\n            <span>\n              <span class=\"pricing-product-name\">{{ product.name }}<\/span>\n              <span class=\"pricing-product-desc\">{{ product.description }}<\/span>\n            <\/span>\n          <\/label>\n          @for (county of counties; track county) {\n            <div class=\"pricing-product-row\">\n              <span>{{ county }}<\/span>\n              <div class=\"input-group pricing-fee-input\">\n                <span class=\"input-group-text\">$<\/span>\n                <input type=\"number\" class=\"form-control\" min=\"0\" step=\"0.01\" [value]=\"defaultFee\"\n                       [attr.aria-label]=\"county + ' ' + product.name + ' fee'\" />\n              <\/div>\n            <\/div>\n          }\n        <\/section>\n      }\n    <\/div>\n  <\/div>\n\n  <div class=\"card-footer\">\n    <button class=\"btn btn-outline-primary\" type=\"button\">BACK<\/button>\n    <button class=\"btn btn-primary\" type=\"button\">CONTINUE<\/button>\n  <\/div>\n<\/div>\n"}, {"path": "products-pricing-card/products-pricing-card.scss", "code": "@use '../styles/variables' as *;\n\n// Breakpoints from the Figma mock bands (Sams-Vibe 683:*):\n//   \u2264767   stacked list     (683:9470 / 683: lor-surface-white;\n  padding: 12px;\n  display: flex;\n  align-items: center;\n  font-size: 14px;\n  line-height: 21px;\n  color: $color-text-secondary;\n}\n\n.cell--corner {\n  background: $color-surface-screen;\n  font-size: 12px;\n  font-weight: 700;\n\n  @media (min-width: $bp-tablet) and (max-width: $bp-desktop - 1) {\n    .corner-label {\n      display: none;\n    }\n  }\n}\n\n.cell--product {\n  background: $color-surface-screen;\n  flex-direction: column;\n  justify-content: center;\n  gap: 8px;\n  padding: 12px 10px;\n  text-align: center;\n\n  @media (min-width: $bp-tablet) and (max-width: $bp-desktop - 1) {\n    background: $color-surface-white;\n    flex-direction: row;\n    justify-content: flex-start;\n    text-align: left;\n  }\n}\n\n.cell--county {\n  @media (min-width: $bp-tablet) and (max-width: $bp-desktop - 1) {\n    background: $color-surface-screen;\n    justify-content: center;\n  }\n}\n\n.cell--fee {\n  justify-content: center;\n}\n\n.product-label {\n  font-size: 12px;\n  font-weight: 700;\n  line-height: 18px;\n  color: $color-text-secondary;\n\n  .icon-info-circle {\n    color: $color-action-primary;\n    font-size: 14px;\n    vertical-align: middle;\n    margin-left: 2px;\n  }\n}\n\n.form-check-input {\n  width: 16px;\n  height: 16px;\n  margin: 0;\n  flex-shrink: 0;\n  cursor: pointer;\n}\n\n// \u2500\u2500 Fee input (existing county-fee-input markup, restyled) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n.pricing-fee-input {\n  width: $fee-input-width;\n  height: $fee-input-height;\n  flex: none;\n  flex-wrap: nowrap;\n\n  .input-group-text {\n    background-color: $color-surface-light;\n    border-color: $color-border-primary;\n    border-radius: 4px 0 0 4px;\n    color: $color-text-primary;\n    font-size: 16px;\n    padding: 0 12px;\n  }\n\n  .form-control {\n    border-color: $color-border-primary;\n    border-radius: 0 4px 4px 0;\n    background-color: $color-surface-white;\n    color: $color-text-primary;\n    font-size: 16px;\n    text-align: right;\n    padding: 0 10px;\n    min-width: 0;\n    -moz-appearance: textfield;\n    appearance: textfield;\n\n    &::-webkit-outer-spin-button,\n    &::-webkit-inner-spin-button {\n      -webkit-appearance: none;\n      margin: 0;\n    }\n  }\n}\n\n// \u2500\u2500 Stacked list (\u2264767) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n.pricing-list {\n  display: flex;\n  flex-direction: column;\n\n  @media (min-width: $bp-tablet) {\n    display: none;\n  }\n}\n\n.pricing-product {\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n\n  & + & {\n    margin-top: 32px;\n    padding-top: 32px;\n    border-top: 1px solid $color-border-lighter;\n  }\n}\n\n.pricing-product-heading {\n  display: flex;\n  align-items: flex-start;\n  gap: 8px;\n  margin: 0 0 0;\n  cursor: pointer;\n\n  .form-check-input {\n    margin-top: 2px;\n  }\n\n  .pricing-product-name {\n    display: block;\n    font-size: 14px;\n    font-weight: 700;\n    line-height: 21px;\n    color: $color-text-primary;\n  }\n\n  .pricing-product-desc {\n    display: block;\n    margin-top: 4px;\n    font-size: 12px;\n    line-height: 18px;\n    color: $color-text-tertiary;\n  }\n}\n\n.pricing-product-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  font-size: 14px;\n  line-height: 21px;\n  color: $color-text-secondary;\n\n  .pricing-fee-input {\n    width: 99.5px;\n  }\n}\n"}, {"path": "products-pricing-card/products-pricing-card.ts", "code": "import { ChangeDetectionStrategy, Component, signal } from '@angular/core';\nimport { DEFAULT_PRICING_FEE, PRICING_COUNTIES, PRICING_PRODUCTS } from '../product-and-fees.data';\n\n/**\n * Redesigned Products & Pricing card (Figma Sams-Vibe 683:8694 / 683:9265 / 683:9756).\n * UI only: the sole behaviour is toggling a product's checkbox. Fee inputs are\n * display-only and pre-filled with the default market rate.\n */\n@Component({\n  selector: 'app-products-pricing-card',\n  standalone: true,\n  templateUrl: './products-pricing-card.html',\n  styleUrl: './products-pricing-card.scss',\n  changeDetection: ChangeDetectionStrategy.OnPush,\n})\nexport class ProductsPricingCardComponent {\n  protected readonly products = PRICING_PRODUCTS;\n  protected readonly counties = PRICING_COUNTIES;\n  protected readonly defaultFee = DEFAULT_PRICING_FEE;\n\n  // Shared by the table and the mobile list so both views stay in sync.\n  protected readonly selected = signal<Record<string, boolean>>(\n    Object.fromEntries(PRICING_PRODUCTS.map((p) => [p.key, true])),\n  );\n\n  protected toggleProduct(key: string): void {\n    this.selected.update((s) => ({ ...s, [key]: !s[key] }));\n  }\n}\n"}, {"path": "section-multi-column/section-multi-column.html", "code": "<div class=\"product-row\" [class.has-header]=\"showHeader()\" role=\"group\" [attr.aria-label]=\"displayText()\">\n  <span class=\"product-row-label\">{{ displayText() }}<\/span>\n  <div class=\"product-row-boxes\">\n    @for (header of headers(); track header.key; let i = $index) {\n    @let fee = columns()[header.key];\n    <div class=\"product-row-col\">\n      @if(!isLandInteriorGroup(displayText(), header.key))\n      {\n      @if (showHeader()) {\n      <span class=\"product-row-col-header\">{{ header.displayName }}<\/span>\n      }\n      <div class=\"input-group product-row-fee-input\" [class.checked]=\"fee?.isEnabled ?? true\">\n        <span class=\"input-group-text\">\n          <input type=\"checkbox\" class=\"form-check-input\" (change)=\"onEnabledChange(fee, $event)\" [checked]=\"fee?.isEnabled ?? true\" />\n        <\/span>\n        <span class=\"input-group-text__dollar\">$<\/span>\n        <input type=\"number\" class=\"form-control\" min=\"0\" step=\"0.01\" [attr.max]=\"maxFeeAmount\" [disabled]=\"!(fee?.isEnabled ?? false)\" (input)=\"fee && onFeeInput(fee, $event)\" (wheel)=\"$any($event.target).blur()\" [value]=\"fee?.fee ?? ''\"\n               [attr.aria-label]=\"displayText() + ' fee'\">\n      <\/div>\n      }\n    <\/div>\n    }\n  <\/div>\n<\/div>\n"}, {"path": "section-multi-column/section-multi-column.scss", "code": "@import 'bootstrap/scss/functions';\n@import 'bootstrap/scss/variables';\n@import 'bootstrap/scss/mixins';\n\n.product-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n\n  .product-row-label {\n    font-size: 16px;\n    color: #304258;\n\n    @include media-breakpoint-down(md) {\n      font-size: 14px;\n    }\n  }\n\n  &.has-header .product-row-label {\n    margin-top: 25px;\n  }\n\n  .product-row-boxes {\n    display: flex;\n    gap: 12px;\n    align-items: flex-start;\n    flex: 0 1 240px;\n    min-width: 240px;\n\n    // Let the row size to its columns' natural (wider) desktop width instead\n    // of being capped at the mobile basis.\n    @include media-breakpoint-up(md) {\n      flex: 0 1 auto;\n    }\n  }\n\n  .product-row-col {\n    flex: 1;\n    min-width: 0;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 6px;\n\n    // Definite width (not just flex-basis) so an empty column (e.g. Land's\n    // interior) still contributes its full size to the row, keeping the\n    // populated column aligned with the other rows.\n    @include media-breakpoint-up(md) {\n      flex: 0 1 auto;\n      width: 150px;\n    }\n\n    // The divider between columns is drawn once by the parent section\n    // (.product-section.multi-column) so it renders as a single continuous\n    // line across all rows instead of per-row segments.\n    &:not(:last-child) {\n      padding-right: 12px;\n\n      // 150px content + 12px divider padding (border-box).\n      @i bile upload\n$mobile-upload-bg: #f3f7fb;\n$mobile-upload-card-bg: color.$color-surface-white;\n$mobile-upload-card-border: #d8e0e8;\n$mobile-upload-heading-text: #2a3d52;\n$mobile-upload-success: #146c2e;\n$mobile-upload-error: #b42318;\n$mobile-upload-primary: #0b69c7;\n$mobile-upload-on-primary: color.$color-surface-white;\n\n// Shared valuation UI colors\n$valuation-card-background: $card-background;\n$valuation-title-color: color.$color-neutral-700;\n$valuation-text-muted: color.$color-neutral-600;\n$valuation-text-disabled: color.$color-neutral-500;\n$valuation-border-light: color.$color-border-light;\n$valuation-border-card: color.$color-border-card;\n$valuation-hover-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);\n\n// Shared button/status colors\n$valuation-action-primary: #2b6cb0;\n$valuation-action-primary-hover: #1e4d7b;\n$valuation-action-primary-soft: #eff6ff;\n$valuation-action-primary-soft-alt: #f0f7fd;\n$valuation-success-soft-bg: #dcfce7;\n$valuation-success-text: #166534;\n$valuation-danger-soft-bg: #fee2e2;\n$valuation-danger-text: #dc2626;\n$valuation-success-border: #1c7c35;\n$valuation-danger-border: #cc3115;\n$valuation-surface-lighter: #f7f8fa;\n$valuation-danger-deep: #b91c1c;\n\n// Recurring availability semantic color/shadow tokens\n$availability-card-bg: #a9d2a8;\n$availability-card-border: color.$color-green-50;\n$availability-status: color.$color-green-90;\n$availability-close-bg: #4f6278;\n$availability-close-bg-hover: #43556b;\n$availability-chip-text: #05152a;\n$availability-drag-bg: #8bcbf2;\n$availability-drag-border: #5e8ca9;\n$availability-chip-shadow: 0 1px 3px rgba(0, 0, 0, 0.15);\n$availability-intro-checks-shadow: 0 1px 3px rgba(10, 54, 69, 0.25);\n$availability-intro-dot: #000;\n$availability-auto-accept-modal-bg: linear-gradient(31deg, #e4f2fe 26.8%, #fdf3e8 95.4%);\n$availability-auto-accept-modal-shadow: 0 4px 17px rgba(10, 54, 69, 0.25);\n$availability-auto-accept-modal-title: #05152a;\n$availability-auto-accept-settings-border: #d8dfe6;\n$availability-auto-accept-card-title: #05152a;\n$availability-auto-accept-card-description: #304258;\n$availability-auto-accept-switch-track: #cfd8dc;\n$availability-auto-accept-switch-knob-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);\n$availability-auto-accept-switch-track-active: #6ea535;\n$availability-card-accent-border: #2d7bc2;\n$availability-card-gradient-start: #f2f8fd;\n$availability-card-gradient-end: #fafcff;\n$availability-card-padding-desktop: 40px 28px 24px;\n$availability-card-shadow-mobile: 0 4px 14px rgba(color.$color-shadow-strong, 0.25);\n\n// Radio/selection component tokens\n$radio-option-hover-border: var(--bs-primary, #0d6efd);\n$radio-option-selected-bg: rgba(13, 110, 253, 0.04);\n$radio-description-color: color.$color-neutral-600;\n\n// Error alert tokens\n$error-alert-text: color.$color-error;\n$error-alert-bg: #fef2f2;\n$error-alert-border: #fecaca;\n\n// Shared mobile capture modal colors\n$capture-modal-backdrop-background: rgba(255, 255, 255, 0.01);\n$capture-modal-panel-background: color.$color-surface-white;\n$capture-modal-panel-shadow: 0 18px 48px rgba(15, 23, 42, 0.24);\n$capture-modal-panel-focus-outline: rgba(29, 79, 145, 0.18);\n$capture-modal-text-tertiary: color.$color-text-tertiary;\n\n// My info specific accents\n$my-info-question-number-background: color.$color-text-secondary;\n$my-info-icon-button-color: #1e6bd6;\n$my-info-icon-button-hover: #e8f1ff;\n\n// Ending-screen next-item cards: the wash behind each card's graphic. Selected\n// by the component's `variant` input, which also picks the graphic itself.\n$ending-card-gradient-w9: linear-gradient(159deg, rgba(232, 220, 201, 0.6) -6.4%, rgba(238, 220, 220, 0.6) 108.8%);\n$ending-card-gradient-ach: linear-gradient(152deg, rgba(245, 234, 204, 0.6) 13.8%, rgba(240, 235, 224, 0.6) 91.99%);\n$ending-card-gradient-parev: linear-gradient(159deg, rgba(231, 250, 247, 0.6) -6.4%, rgba(220, 226, 238, 0.6) 108.8%);\n$ending-card-gradient-geocom: linear-gradient(152deg, rgba(192, 228, 204, 0.6) -28.3%, rgba(234, 246, 242, 0.6) 103.99%);\n$ending-card-gradient-profile: linear-gradient(159deg, rgba(216, 207, 249, 0.6) -38.25%, rgba(220, 226, 238, 0.6) 86.11%);\n$ending-card-gradient-background: linear-gradient(156deg, rgba(183, 208, 246, 0.6) -33.37%, rgba(220, 226, 238, 0.6) 84.71%);\n"}]</script>
<script>
const FILES=JSON.parse(document.getElementById('data').textContent);
const ROOT='src/app/sandboxes/sam/product-and-fees/';
const nav=document.getElementById('files');
let cur=0;
function lang(p){return p.endsWith('.ts')?'typescript':p.endsWith('.scss')?'scss':p.endsWith('.html')?'xml':'plaintext'}
let lastDir=null;
FILES.forEach((f,i)=>{
  const parts=f.path.split('/');const dir=parts.length>1?parts.slice(0,-1).join('/'):'(root)';
  if(dir!==lastDir){const d=document.createElement('div');d.className='dir';d.textContent=dir;nav.appendChild(d);lastDir=dir}
  const b=document.createElement('button');b.type='button';b.textContent=parts[parts.length-1];b.title=f.path;
  b.onclick=()=>show(i);nav.appendChild(b);f.btn=b;
});
function show(i){
  FILES[cur].btn.classList.remove('on');cur=i;const f=FILES[i];f.btn.classList.add('on');
  document.getElementById('path').textContent=ROOT+f.path;
  let html;
  try{html=window.hljs?hljs.highlight(f.code,{language:lang(f.path),ignoreIllegals:true}).value:null}catch(e){html=null}
  if(html===null){html=f.code.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
  // split highlighted html into lines while keeping open spans balanced
  const lines=[];let open=[];
  html.split('\n').forEach(line=>{
    const pre=open.join('');
    const re=/<span[^>]*>|<\/span>/g;let m;
    while((m=re.exec(line))){if(m[0]==='</span>')open.pop();else open.push(m[0])}
    lines.push(pre+line+'</span>'.repeat(open.length));
  });
  if(lines.length&&lines[lines.length-1].replace(/<[^>]+>/g,'')==='')lines.pop();
  document.getElementById('meta').textContent=lines.length+' lines';
  document.getElementById('code').innerHTML='<table><tbody>'+lines.map((l,n)=>'<tr><td class="n">'+(n+1)+'</td><td class="l hljs">'+(l||' ')+'</td></tr>').join('')+'</tbody></table>';
  document.getElementById('code').scrollTop=0;
}
document.getElementById('copy').onclick=async e=>{
  try{await navigator.clipboard.writeText(FILES[cur].code);e.target.textContent='Copied'}catch(_){e.target.textContent='Copy failed'}
  setTimeout(()=>e.target.textContent='Copy',1500);
};
const start=FILES.findIndex(f=>f.path.startsWith('products-pricing-card/')&&f.path.endsWith('.html'));
show(start<0?0:start);

function tab(name){
  ['component','report'].forEach(n=>{
    document.getElementById(n).classList.toggle('on',n===name);
    document.getElementById('t-'+n).setAttribute('aria-selected',n===name);
  });
  if(name==='report'){const r=document.getElementById('report');if(!r.firstChild){const f=document.createElement('iframe');f.src='report.html';f.title='Products & Pricing card build report';r.appendChild(f)}}
  if(location.hash!=='#'+name)history.replaceState(null,'','#'+name);
}
document.getElementById('t-component').onclick=()=>tab('component');
document.getElementById('t-report').onclick=()=>tab('report');
window.addEventListener('hashchange',()=>tab(location.hash==='#report'?'report':'component'));
if(location.hash==='#report')tab('report');
</script>
</body></html>
